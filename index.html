<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>GreenKit English</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap">
<link rel="stylesheet" href="assets/app.css?v=1.0.0">
</head>
<body>
<header class="hero">
  <div class="crew hopper" id="crew"></div>
  <h1 class="logo">GreenKit <span>English</span></h1>
  <p class="tag">安親班英文練習｜每次打開，題目都不一樣</p>
</header>

<main class="wrap">
  <div class="units" id="units"></div>
  <section class="card how">
    <h2>怎麼練習</h2>
    <ul>
      <li><b>句型練習</b>：選擇、挑出正確的句子、排字卡、拼單字、對或錯。每次從題庫隨機出 15 題。</li>
      <li><b>聽力練習</b>：平板會念英文，聽完選答案。請打開聲音。</li>
      <li>答錯第一次會給提示，告訴你翻<b>課本</b>或<b>習作</b>哪一頁；第二次會直接告訴你答案。</li>
      <li>練完會列出要再看一次的題目和頁碼，可以拿課本對照。</li>
    </ul>
    <p class="note">給爸爸媽媽：題目整理自孩子安親班的課本和習作（Unit 1～3），題庫檔案在 <code>banks/</code> 資料夾，可以直接修改。網站不保存任何作答紀錄。</p>
  </section>
</main>

<footer class="foot">非官方、粉絲自製教材・僅供學習使用<span id="ver"></span></footer>

<script src="assets/app.js?v=1.0.0"></script>
<script>
(() => {
  const { $, esc, shuffle, CREW, ICON, pikImg } = GK;
  $('#crew').innerHTML = shuffle(CREW).map(k => pikImg(k)).join('');
  $('#ver').textContent = `　V${GK.VER}・最後更新 ${GK.DATE.replace(/-/g, '/')}`;
  const box = $('#units');
  box.innerHTML = GK.UNITS.map(u => `<section class="card unit" id="u${u}"><p class="kicker">Unit ${u}</p><h2>讀取中…</h2></section>`).join('');
  GK.UNITS.forEach((u, i) => {
    GK.loadUnit(u).then(d => {
      const n = l => d.sections.reduce((s, x) => s + x.items.filter(it => GK.isListen(it) === l).length, 0);
      const name = d.title.replace(/^Unit\s*\d+\s*/, '');
      $('#u' + u).innerHTML = `
        <div class="unit-pik">${pikImg(CREW[(i * 3) % 8])}</div>
        <p class="kicker">Unit ${u}</p>
        <h2>${esc(name)}</h2>
        <p class="scope">${esc(d.scope)}</p>
        <ul class="topics">${d.sections.filter(s => s.items.some(it => !GK.isListen(it))).map(s => `<li>${esc(s.name.replace(/^[^｜]*｜/, ''))}</li>`).join('')}</ul>
        <div class="unit-btns">
          <a class="btn primary" href="practice.html?u=${u}&m=s">${ICON.next}句型練習<small>${n(false)} 題庫</small></a>
          <a class="btn sun" href="practice.html?u=${u}&m=l">${ICON.spk}聽力練習<small>${n(true)} 題庫</small></a>
        </div>`;
    }).catch(() => {
      $('#u' + u).innerHTML = `<p class="kicker">Unit ${u}</p><h2>題庫讀不到</h2><p class="scope">請用網址打開這個網站（不要直接點兩下 html 檔）。</p>`;
    });
  });
})();
</script>
</body>
</html>
